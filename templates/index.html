<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider3D Stickers</title>
</head>
<body>
    <h1>Spider3D Stickers</h1>
    <form action="/process_order" method="post">
        <label for="orderLinkField">Order Number:</label>
        <input type="text" id="orderLinkField" name="orderLinkField" required>
        <label for="packNum">Number of Packs:</label>
        <input type="number" id="packNum" name="packNum" value="1" required>
        <button type="submit">Process</button>
    </form>
    <form action="/complete_order" method="post">
        <button type="submit">Complete Order</button>
    </form>
</body>
</html>
